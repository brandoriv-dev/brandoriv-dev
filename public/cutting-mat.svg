<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mat" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2c5240"/>
      <stop offset="0.5" stop-color="#274935"/>
      <stop offset="1" stop-color="#21402f"/>
    </linearGradient>

    <!-- fine grid: 40u squares -->
    <pattern id="fine" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d6ecdf" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <!-- bold grid: every 200u (5 squares) -->
    <pattern id="bold" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#d6ecdf" stroke-opacity="0.14" stroke-width="1.4"/>
    </pattern>

    <!-- matte vinyl grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <!-- base + grid -->
  <rect width="1920" height="1200" fill="url(#mat)"/>
  <rect width="1920" height="1200" fill="url(#fine)"/>
  <rect width="1920" height="1200" fill="url(#bold)"/>

  <!-- protractor angle fan from the top-left corner -->
  <g stroke="#d6ecdf" stroke-opacity="0.05" stroke-width="1.2">
    <line x1="0" y1="0" x2="2221" y2="595"/>
    <line x1="0" y1="0" x2="1992" y2="1150"/>
    <line x1="0" y1="0" x2="1626" y2="1626"/>
    <line x1="0" y1="0" x2="1150" y2="1992"/>
    <line x1="0" y1="0" x2="595" y2="2221"/>
  </g>

  <!-- concentric radius guides from the bottom-right corner -->
  <g fill="none" stroke="#d6ecdf" stroke-opacity="0.06" stroke-width="1.2">
    <circle cx="1920" cy="1200" r="260"/>
    <circle cx="1920" cy="1200" r="520"/>
    <circle cx="1920" cy="1200" r="780"/>
    <circle cx="1920" cy="1200" r="1040"/>
  </g>

  <!-- centre crosshair -->
  <g stroke="#d6ecdf" stroke-opacity="0.10" stroke-width="1.2">
    <line x1="936" y1="600" x2="984" y2="600"/>
    <line x1="960" y1="576" x2="960" y2="624"/>
  </g>

  <rect width="1920" height="1200" filter="url(#grain)"/>
</svg>
