<svg xmlns="http://www.w3.org/2000/svg" width="680" height="880" viewBox="0 0 680 880" role="img" aria-label="Photo placeholder, 8.5 by 11 inch proportions">
  <defs>
    <linearGradient id="bw" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.55" stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.4" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#5a5a5a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="680" height="880" fill="url(#bw)"/>
  <rect width="680" height="880" fill="url(#spot)"/>

  <!-- abstract head-and-shoulders silhouette so the framing reads as a portrait -->
  <g fill="#000000" opacity="0.28">
    <circle cx="340" cy="360" r="120"/>
    <path d="M150 880 C 150 640, 250 560, 340 560 C 430 560, 530 640, 530 880 Z"/>
  </g>

  <rect width="680" height="880" filter="url(#grain)" opacity="0.5"/>

  <g fill="#cfcabb" font-family="Georgia, serif" text-anchor="middle">
    <text x="340" y="70" font-size="24" letter-spacing="4">PLACEHOLDER</text>
    <text x="340" y="100" font-size="15" fill="#9a9588" letter-spacing="2">Black &amp; white photo · 8.5 × 11</text>
  </g>

  <rect x="1" y="1" width="678" height="878" fill="none" stroke="#000000" stroke-opacity="0.4"/>
</svg>
