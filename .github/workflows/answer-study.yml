name: MCP answer study

# Re-runs the live model-answer quality study after a merge to main and opens a PR
# with the refreshed numbers. This is separate from ci.yml's deterministic gate:
# it calls a real model (real provider usage, real cost) and its output is not
# bit-for-bit reproducible run to run, so it never blocks a merge and never runs
# on a pull request — only after code has already landed on main.
#
# Inert until ANTHROPIC_API_KEY is added as a repository secret: the job below
# checks for it and exits without spending anything if it is unset.
#
# Bounded by default to ANSWER_STUDY_CASES corpus cases (front of mcp/corpus.mjs,
# same subset every run) to keep per-merge cost predictable. Raise or remove the
# repository variable ANSWER_STUDY_CASES to cover more of the corpus.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cases:
        description: "Corpus cases to run (blank = repository default, 0 = full corpus)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  study:
    name: Run the live answer study
    runs-on: ubuntu-latest
    steps:
      - name: Check for an API key
        id: gate
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not set as a repository secret; skipping the live study."
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.configured == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.configured == 'true'
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
        if: steps.gate.outputs.configured == 'true'

      - name: Run the study and patch evaluation.ts
        if: steps.gate.outputs.configured == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANSWER_STUDY_CASES: ${{ github.event.inputs.cases || vars.ANSWER_STUDY_CASES || '8' }}
        run: bun run mcp:answer-study -- --write

      - name: Verify the deterministic suites still pass against the new snapshot
        if: steps.gate.outputs.configured == 'true'
        run: |
          bun run mcp:check
          bun run mcp:answer-study-test
          bun run mcp:dashboard-test

      - name: Open a PR with the refreshed numbers
        if: steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- mcp/evaluation.ts; then
            echo "No change to evaluation.ts; nothing to open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="answer-study/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git add mcp/evaluation.ts mcp/assessments/answer-study
          git commit -m "Refresh the MCP answer-study snapshot

Automated run of bun run mcp:answer-study against main after merge.
Transcripts for every case are retained under mcp/assessments/answer-study/.

Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Refresh the MCP answer-study snapshot" \
            --body "Automated post-merge run of \`bun run mcp:answer-study\`. Retained transcripts are included in this PR under \`mcp/assessments/answer-study/\`; the diff to \`mcp/evaluation.ts\` is machine-generated from them via \`bun run mcp:answer-study -- --aggregate <runId> --write\`, which can be re-run offline against the same transcripts to check this PR's numbers without another live call.

🤖 Generated with [Claude Code](https://claude.com/claude-code)"
