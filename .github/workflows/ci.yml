name: CI

# Cloudflare Workers Builds deploys main on its own. This workflow does not deploy;
# it gates what reaches main, so a broken policy cannot ship unnoticed.
on:
  # Pull requests are the gate. main runs again after merge as a safety net,
  # since Cloudflare deploys it without waiting for this workflow.
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  moss:
    uses: brandoriv-dev/cicd/.github/workflows/moss-catalog.yml@d1fe964c9d84b234814ce67b111c5f7448f55ce8
    permissions:
      contents: read

  browser:
    name: Dashboard and Moss browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --config playwright.mcp.config.mjs

  checks:
    name: Policy and dashboard checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run mcp:check
      - run: bun run mcp:auth-test
      - run: bun run mcp:answer-study-test
      - run: bun run mcp:dashboard-test
      - run: bun run mcp:routing-test
      - run: bun run harness:test
      - run: bun run mcp:policy-eval

      # The operation journals. Deliberately not part of "bun run build", which is
      # on the deploy path: a record formatting problem must never block a publish.
      - run: bun run changes:test
      - run: bun run changes:lint

  smoke:
    name: MCP smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build

      # The smoke test is the only suite that asserts on what an MCP client
      # actually receives over the wire, so it runs against a real worker.
      - name: Start worker
        run: |
          bunx wrangler dev --local --port 8791             --var MCP_BEARER_TOKEN:ci-test-token             --var MICROSOFT_CLIENT_SECRET:ci-test-secret > wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8791/mcp/health > /dev/null; then
              echo "worker up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "worker failed to start"; cat wrangler.log; exit 1

      - name: Run smoke test
        env:
          MCP_URL: http://127.0.0.1:8791/mcp
          MCP_BEARER_TOKEN: ci-test-token
        run: bun run mcp:smoke

      - name: Worker log on failure
        if: failure()
        run: cat wrangler.log
